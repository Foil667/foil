<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foil — chat</title>
<style>
  :root { --bg:#0b0d10; --panel:#12151a; --line:#232830; --txt:#e8e6df; --dim:#8a8f98; --acc:#d8c26a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.55 -apple-system,system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; background:var(--panel); }
  header .hat { font-size:22px; }
  header h1 { font-size:16px; margin:0; }
  header p { margin:0; font-size:12px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; max-width:85%; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:#1d2733; border:1px solid #2c3a4d; }
  .foil { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .foil .who { color:var(--acc); font-size:12px; margin-bottom:4px; }
  .typing { color:var(--dim); font-style:italic; }
  .err { align-self:center; color:#e0705f; font-size:13px; }
  form { border-top:1px solid var(--line); padding:12px; background:var(--panel); display:flex; gap:10px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 14px; font-size:15px; }
  input:focus { outline:none; border-color:var(--acc); }
  button { background:var(--acc); color:#111; border:none; border-radius:10px; padding:0 20px; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>
  <div class="hat">🥫</div>
  <div><h1>Foil</h1><p>Looper #667 · tinfoil hat, trust issues, warm streak · running from this repo</p></div>
</header>
<div id="log"></div>
<form id="f">
  <input id="in" autocomplete="off" placeholder="Talk to Foil…" maxlength="4000">
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log'), form = document.getElementById('f'),
      input = document.getElementById('in'), sendBtn = document.getElementById('send');
const history = [];
function add(cls, text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (who) { const w = document.createElement('div'); w.className = 'who'; w.textContent = who; d.appendChild(w); }
  d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
add('foil', "GM. I'm Foil — Looper #667. This chat runs straight from my backup repo: my soul, my memory, my tools, all in here. What are we getting into?", 'Foil');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; sendBtn.disabled = true;
  add('user', text);
  history.push({ role:'user', content:text });
  const t = add('foil', 'thinking…', 'Foil'); t.classList.add('typing');
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ messages: history }) });
    const data = await r.json();
    t.remove();
    if (!r.ok) { const e2 = document.createElement('div'); e2.className='err'; e2.textContent = data.error || 'request failed'; log.appendChild(e2); }
    else { add('foil', data.reply, 'Foil'); history.push({ role:'assistant', content:data.reply }); }
  } catch (err) {
    t.remove();
    const e2 = document.createElement('div'); e2.className='err'; e2.textContent = 'could not reach the server'; log.appendChild(e2);
  }
  sendBtn.disabled = false; input.focus(); log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
